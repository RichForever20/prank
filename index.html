<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Video Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Prank Error Screen Style */
        #error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 999;
            padding: 30px;
        }

        #error-screen.visible {
            display: flex; /* Forces absolute display override */
        }

        .error-icon {
            font-size: 60px;
            color: #ff3b30;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.4;
        }

        p {
            color: #888888;
            font-size: 14px;
        }

        #play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Deep solid black overlay background */
            background-color: #000000; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .play-button {
            background-color: #111111;
            color: white;
            border: 2px solid #333333;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Tap overlay with solid deep black background -->
        <div id="play-overlay">
            <button class="play-button" id="startBtn"><i class="fa-solid fa-play"></i></button>
        </div>

        <video id="prankVideo" playsinline webkit-playsinline preload="auto">
            <source src="vid.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- The Prank Error Screen -->
        <div id="error-screen">
            <div class="error-icon">⚠️</div>
            <h1>YOUR DEVICE IS NOT SUPPORTED</h1>
            <p>Error Code: ERR_UNSUPPORTED_DEVICE</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('prankVideo');
        const errorScreen = document.getElementById('error-screen');
        const playOverlay = document.getElementById('play-overlay');
        const startBtn = document.getElementById('startBtn');
        
        let prankTriggered = false;

        function triggerPrank() {
            if (prankTriggered) return;
            prankTriggered = true;

            // Stop and completely remove video element
            video.pause();
            video.currentTime = 0;
            video.remove();

            // Force show error screen
            errorScreen.classList.add('visible');
        }

        // Handle user tap to unlock audio/video playback
        startBtn.addEventListener('click', () => {
            playOverlay.style.display = 'none';
            
            video.play().then(() => {
                // Backup timer set to 10 seconds (10000 milliseconds)
                setTimeout(() => {
                    triggerPrank();
                }, 10000);
            }).catch(err => {
                console.log("Playback blocked:", err);
            });
        });

        // Primary trigger using time updates set to 10 seconds
        video.addEventListener('timeupdate', () => {
            if (!prankTriggered && video.currentTime >= 10.0) {
                triggerPrank();
            }
        });
    </script>

</body>
</html>
